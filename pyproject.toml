# 이 service는 배포되는 container지 배포되는 package가 아니다.
# 그래서 build backend / editable install을 만들지 않았다.
# dependency는 requirements.txt(runtime) / requirements-dev.txt(개발)가 source of truth다.

[project]
name = "ggumirror-be"
version = "0.1.0"
description = "꾸미러 backend service"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
